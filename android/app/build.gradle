plugins {
    id 'com.android.application'
}

android {
    namespace 'es.und.app'
    compileSdk 34

    defaultConfig {
        applicationId "es.und.app"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
        buildConfigField "String", "APP_URL", "\"" + (System.getenv("APP_URL") ?: "https://example.github.io/") + "\""
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file("und.jks")
            storePassword System.getenv("KS_PASS")
            keyAlias "und"
            keyPassword System.getenv("KS_PASS")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
