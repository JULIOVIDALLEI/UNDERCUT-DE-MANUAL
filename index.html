<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<title>UND · Undercut de manual</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --bg2:#0c1015; --panel:#11161d; --panel2:#171d26; --line:#232b37; --line2:#2d3746;
  --txt:#eef2f7; --mut:#8a96a8; --dim:#5b6676; --acc:#ff2a2a; --ok:#22c55e; --live:#ff2a2a;
  --gold:#f5c542; --silver:#c9d1dc; --bronze:#d08b52;
  --r:18px; --cond:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif; --ui:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:15px;line-height:1.4}
body{min-height:100vh;
  background:
    radial-gradient(900px 500px at 110% -10%, color-mix(in srgb,var(--acc) 22%,transparent), transparent 60%),
    radial-gradient(700px 400px at -20% 10%, #1b2533 0%, transparent 60%),
    repeating-linear-gradient(45deg,#ffffff03 0 2px,transparent 2px 6px),
    var(--bg);
  background-attachment:fixed;
  transition:background .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 96px)}

/* Header */
header{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(var(--sat) + 10px) 16px 10px;
  background:linear-gradient(var(--bg) 60%, transparent);backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.lock .wm svg{display:block;height:42px;width:auto;filter:drop-shadow(0 4px 12px #ff2a2a40)}
.brand{min-width:0}
.lock{display:flex;align-items:center;gap:9px}
.slogan{font:800 italic 12px/1.02 var(--cond);letter-spacing:1.4px;text-transform:uppercase;color:#ff4d40;border-left:2px solid #ff2a2a;padding-left:8px}
.logo b{font-family:var(--cond);font-weight:800;font-style:italic;font-size:31px;letter-spacing:1px;line-height:.9}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:500;letter-spacing:.2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px;box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 4px;padding:2px 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);transition:.2s}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c);transform:skewX(-15deg)}
.chip.on{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 38%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 4px 18px -6px var(--c)}

/* Titles */
h2{font-family:var(--cond);font-weight:800;font-style:italic;font-size:22px;letter-spacing:.4px;text-transform:uppercase;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:5px;height:18px;background:var(--acc);transform:skewX(-15deg);border-radius:1px}
h2 .sub{margin-left:auto;font:500 12px var(--ui);color:var(--mut);text-transform:none;font-style:normal;letter-spacing:0}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-top:8px;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 55%,#000) 0%,color-mix(in srgb,var(--c) 18%,var(--panel)) 45%,var(--panel) 100%);
  border:1px solid color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 20px 50px -25px var(--c)}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:220px;height:260px;opacity:.13;
  background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/28px 28px;transform:rotate(18deg);
  mask:linear-gradient(225deg,#000 20%,transparent 70%);-webkit-mask:linear-gradient(225deg,#000 20%,transparent 70%)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--ui);letter-spacing:1px;text-transform:uppercase;background:#0006;padding:5px 10px;border-radius:8px}
.hero h3{font-family:var(--cond);font-weight:800;font-style:italic;font-size:32px;line-height:1;margin:12px 0 4px;text-transform:uppercase;position:relative;z-index:1}
.hero .loc{color:#ffffffc0;font-size:13px;position:relative;z-index:1}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.cd div{background:#0008;border:1px solid #ffffff14;border-radius:14px;padding:10px 0 8px;text-align:center}
.cd b{display:block;font-family:var(--cond);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#ffffffa0}
.hero .when{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;position:relative;z-index:1}
.hero .when strong{font-family:var(--cond);font-size:19px;letter-spacing:.3px}

/* Cards & rows */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:10px}
.day{font:700 12px var(--ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.time{width:52px;flex:none;font-family:var(--cond);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.time small{display:block;font:500 10px var(--ui);color:var(--mut);letter-spacing:.4px}
.badge{flex:none;font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.6px;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);text-transform:uppercase}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px;font:800 11px var(--ui);letter-spacing:1px;color:#fff;background:var(--live);padding:3px 8px;border-radius:6px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.add{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--bg2);border:1px solid var(--line);color:var(--mut);flex:none}
.add svg{width:17px;height:17px}
.add:active{transform:scale(.92)}

/* Winners carousel */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.win{text-align:left;flex:none;width:72%;max-width:300px;scroll-snap-align:start;border-radius:var(--r);padding:14px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 30%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--c) 35%,var(--line))}
.win .t2{margin-top:8px}
.win .who{font-family:var(--cond);font-weight:800;font-size:24px;line-height:1.05;margin-top:4px;text-transform:uppercase}
.win .tm{font-size:12.5px;color:#ffffffb0}

/* Calendar */
.ev{display:flex;gap:14px;padding:14px;align-items:center;width:100%;text-align:left}
.rnd{width:46px;flex:none;text-align:center}
.rnd b{display:block;font-family:var(--cond);font-weight:800;font-style:italic;font-size:26px;line-height:1;color:var(--c)}
.rnd span{font-size:10px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.ev .flag{font-size:20px;margin-right:4px}
.st{font:700 10.5px var(--ui);letter-spacing:.8px;text-transform:uppercase;padding:3px 7px;border-radius:6px;flex:none}
.st.done{background:#22c55e1f;color:#5ee28f}
.st.next{background:color-mix(in srgb,var(--c) 25%,transparent);color:#fff}
.st.up{background:#ffffff0d;color:var(--mut)}
.ev.past{opacity:.72}
.sess{background:var(--bg2);border-top:1px solid var(--line);padding:4px 0}
.sess .row{border-top:1px dashed var(--line);padding:10px 14px}
.sess .row:first-child{border-top:0}
.chev{transition:.25s;color:var(--dim)}
.open .chev{transform:rotate(180deg)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);font-weight:600;font-size:13.5px}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff}

/* Results / standings */
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:32px;padding:0 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
.pill.on{background:var(--txt);color:#000;border-color:var(--txt)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{height:36px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 12px}
.pod{border-radius:16px;padding:12px 8px;text-align:center;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.pod::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--m)}
.pod .p{font-family:var(--cond);font-weight:800;font-style:italic;font-size:30px;line-height:1;color:var(--m)}
.pod .n{font-family:var(--cond);font-weight:700;font-size:17px;line-height:1.05;margin-top:6px;text-transform:uppercase;word-break:break-word}
.pod .s{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod.p1{padding:18px 8px;background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 16%,var(--panel)),var(--panel))}
.tbl .row{padding:10px 14px}
.pos{width:30px;flex:none;font-family:var(--cond);font-weight:800;font-size:20px;text-align:center;color:var(--mut)}
.pos.g{color:var(--gold)}.pos.s{color:var(--silver)}.pos.b{color:var(--bronze)}
.val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.val b{font-family:var(--cond);font-weight:800;font-size:20px}
.val small{display:block;font-size:11px;color:var(--mut)}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px}
.leader{display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;margin-bottom:12px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#000),var(--panel) 75%);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.leader .big{font-family:var(--cond);font-weight:800;font-style:italic;font-size:54px;line-height:.9;color:#fff}
.leader .nm{font-family:var(--cond);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.note{font-size:12.5px;color:var(--mut);background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
.empty b{display:block;font-family:var(--cond);font-size:22px;color:var(--txt);margin-bottom:6px;text-transform:uppercase}
.banner{font-size:12.5px;background:#f5c54222;border:1px solid #f5c54255;color:#ffe08a;border-radius:12px;padding:9px 12px;margin-top:10px}

/* Bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(var(--sab) + 10px);
  background:linear-gradient(transparent, var(--bg) 35%)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:22px;
  background:#11161dE6;border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 10px 40px #000a}
nav button{height:56px;min-width:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.2px}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 28%,transparent),transparent);box-shadow:inset 0 2px 0 var(--acc)}

/* Sheet */
.scrim{position:fixed;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--sab) + 24px);
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 10px}
.tog{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--c)}
.sw.on::after{left:21px}
.chg{display:inline-block;font:700 10px var(--ui);letter-spacing:.6px;text-transform:uppercase;color:#ffd27a;background:#f5c5421f;border:1px solid #f5c54255;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.newcal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#22c55e22,var(--panel));border:1px solid #22c55e55}
.newcal b{font-family:var(--cond);font-size:19px;text-transform:uppercase}
.sub-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.sub-row a{color:inherit;text-decoration:none}
.nfeat{position:relative;flex:none;width:86%;max-width:420px;height:250px;scroll-snap-align:start;border-radius:22px;overflow:hidden;display:block;color:#fff;text-decoration:none;
  background:linear-gradient(140deg,color-mix(in srgb,var(--c) 60%,#000),var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.nfeat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nfeat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 25%,#000d 78%)}
.nfeat .in{position:absolute;left:0;right:0;bottom:0;padding:16px;z-index:1}
.nfeat h4{font-family:var(--cond);font-weight:800;font-size:25px;line-height:1.02;margin:8px 0 6px;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{font-size:12px;color:#ffffffb8;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nitem{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none;align-items:flex-start}
.nitem:first-child{border-top:0}
.nthumb{width:92px;height:68px;flex:none;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 45%,#000),var(--panel2));display:grid;place-items:center;font-family:var(--cond);font-weight:800;font-size:15px;color:#fff9}
.nthumb img{width:100%;height:100%;object-fit:cover;display:block}
.ntitle{font-weight:600;font-size:14.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nsum{font-size:12.5px;color:var(--mut);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lang{font:700 9.5px var(--ui);letter-spacing:.6px;padding:1px 5px;border-radius:4px;background:#ffffff14;color:var(--mut)}
.hot{font:800 10px var(--ui);letter-spacing:.8px;color:#000;background:var(--gold);padding:2px 6px;border-radius:5px}
.av{--z:36px;position:relative;width:var(--z);height:var(--z);flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c,#888) 38%,#2a3340),#121820 75%);box-shadow:0 0 0 2px var(--ring,var(--line2)),0 4px 12px -4px #000}
.av i{font:800 calc(var(--z)*.36)/1 var(--cond);font-style:normal;letter-spacing:.5px;color:#ffffffd0}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.pod .av{margin:8px auto 0}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(600px 400px at 50% 40%,#3a0a0e,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .45s, visibility .45s}
#splash .wm svg{display:block;width:min(70vw,300px);height:auto;filter:drop-shadow(0 14px 34px #ff2a2a55);animation:pop .5s cubic-bezier(.2,1.4,.4,1) .15s both}
#splash .sl{font:800 italic 18px var(--cond);letter-spacing:5px;text-transform:uppercase;color:#ff4d40;margin-top:12px;animation:pop .5s .3s both}
.lights{display:flex;gap:12px;margin-bottom:38px;padding:10px 14px;background:#0d1014;border:1px solid #222a35;border-radius:14px}
.lights i{width:26px;height:26px;border-radius:50%;background:#2a0d10;box-shadow:inset 0 2px 6px #000}
.lights i.on{background:radial-gradient(circle at 40% 35%,#ff8a80,#ff1a1a 55%,#a00);box-shadow:0 0 18px #ff2a2a,0 0 40px #ff2a2a88}
.lights.out i{background:#2a0d10;box-shadow:inset 0 2px 6px #000;transition:.08s}
#splash.off{opacity:0;visibility:hidden}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.tv{font-size:11.5px;color:var(--mut);margin-top:3px;white-space:normal;line-height:1.3}
.tv .free{font:800 9.5px var(--ui);letter-spacing:.6px;color:#04120a;background:#3ddc84;padding:1px 5px;border-radius:4px;margin-right:2px}
.tv .fr{color:#7ee2a8;font-weight:600}
.hero .tv{color:#ffffffc8;font-size:12.5px;margin-top:6px;position:relative;z-index:1}
.wx{font-size:11.5px;color:#a9c7ee;margin-top:3px;line-height:1.3}
.wx.rain{color:#69b7ff;font-weight:600}
.hero .wx{color:#ffffffd8;font-size:12.5px;margin-top:8px;position:relative;z-index:1}
.seg.cls button.on{background:color-mix(in srgb,var(--c) 30%,var(--panel2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent);color:#fff}
.wk{flex:none;width:80%;max-width:330px;scroll-snap-align:start;text-align:left;border-radius:20px;padding:14px 16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 42%,#000),var(--panel) 80%);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.wk b{display:block;font:800 italic 22px/1.05 var(--cond);text-transform:uppercase;margin:8px 0 4px}

<script>
'use strict';
const SERIES = [

const CLASSES = ['motogp','moto2','moto3'];
const FLAGS = {Australia:'🇦🇺',Austria:'🇦🇹',Azerbaijan:'🇦🇿',Bahrain:'🇧🇭',Belgium:'🇧🇪',Brazil:'🇧🇷',Canada:'🇨🇦',China:'🇨🇳',Croatia:'🇭🇷',Czechia:'🇨🇿','Czech Republic':'🇨🇿',Estonia:'🇪🇪',Finland:'🇫🇮',France:'🇫🇷',Germany:'🇩🇪','Great Britain':'🇬🇧',UK:'🇬🇧','United Kingdom':'🇬🇧',England:'🇬🇧',Greece:'🇬🇷',Hungary:'🇭🇺',India:'🇮🇳',Indonesia:'🇮🇩',Italy:'🇮🇹',Japan:'🇯🇵',Kenya:'🇰🇪',Malaysia:'🇲🇾',Mexico:'🇲🇽',Monaco:'🇲🇨',Netherlands:'🇳🇱',Portugal:'🇵🇹',Qatar:'🇶🇦',Poland:'🇵🇱','Saudi Arabia':'🇸🇦',Singapore:'🇸🇬',Spain:'🇪🇸',Sweden:'🇸🇪',Thailand:'🇹🇭',Turkey:'🇹🇷',UAE:'🇦🇪','United Arab Emirates':'🇦🇪',USA:'🇺🇸','United States':'🇺🇸',Argentina:'🇦🇷',Chile:'🇨🇱',Paraguay:'🇵🇾',Latvia:'🇱🇻','South Africa':'🇿🇦',Morocco:'🇲🇦','New Zealand':'🇳🇿',Uruguay:'🇺🇾',Kazakhstan:'🇰🇿',Ireland:'🇮🇪',Lithuania:'🇱🇹','San Marino':'🇸🇲',Switzerland:'🇨🇭'};
const flag = (ev) => (ev.iso && ev.iso.length === 2 ? String.fromCodePoint(...[...ev.iso.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : FLAGS[ev.country] || '🏁');

const LS = {
  get(k, d){ try{ const v = localStorage.getItem('pw_'+k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem('pw_'+k, JSON.stringify(v)); }catch{} },
};
const st = {
  data: null, view: (v => v === 'finde' ? 'agenda' : v)(LS.get('view','agenda')), sel: LS.get('sel','f1'), favs: LS.get('favs', SERIES.map(s=>s.key)),
  stTab: 'drivers', open: null, cls: LS.get('cls','motogp'), finde: null, findeCls: 'all', wx: LS.get('wx', {}), meta: LS.get('meta', null),
  al: LS.get('alerts', { on:false, series: Object.fromEntries([...SERIES, ...SUBS].map(s => [s.key, true])), tipos: { clasif:true, sprint:true, carrera:true, libres:false }, t:0 }), calSeason: {}, tv: LS.get('tv', null), status: null, faces: {}, news: LS.get('news', null), newsEn: LS.get('newsEn', true), resEv: {}, resSe: {}, loading: false, offline: false,
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fT = new Intl.DateTimeFormat('es-ES', { hour:'2-digit', minute:'2-digit' });
const fD = new Intl.DateTimeFormat('es-ES', { weekday:'long', day:'numeric', month:'long' });
const fDs = new Intl.DateTimeFormat('es-ES', { day:'numeric', month:'short' });
const fW = new Intl.DateTimeFormat('es-ES', { weekday:'short' });
const dayKey = (t) => { const d = new Date(t); return d.getFullYear()*1e4 + (d.getMonth()+1)*100 + d.getDate(); };
function dayLabel(t){
  const today = dayKey(Date.now()), tm = dayKey(Date.now()+864e5), k = dayKey(t);
  if (k === today) return 'Hoy · ' + fD.format(t);
  if (k === tm) return 'Mañana · ' + fD.format(t);
  return fD.format(t);
}
function ago(iso){
  if (!iso) return '—';
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'ahora mismo'; if (m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `hace ${h} h`; return `hace ${Math.round(h/24)} d`;
}
const sd = (k) => st.data?.series?.[k] || null;
const tms = (s) => +new Date(s.start);
const endms = (s) => tms(s) + (s.dur || 120) * 60000;
const isLive = (s, now = Date.now()) => tms(s) <= now && now < endms(s);

function sType(name, main){
  const n = String(name).toLowerCase();
  if (/superpole race|sprint/.test(n)) return 'sprint';
  if (/clasif|qualif|hyperpole|superpole|shootout/.test(n)) return 'clasif';
  if (/libre|práctica|practica|practice|warm|shakedown/.test(n)) return 'libres';
  if (main || /carrera|race|power stage|tramos/.test(n)) return 'carrera';
  return 'libres';
}
function sessions(keys){
  const out = [];
  for (const sk of ['moto2','moto3']) if (keys.includes('motogp')) for (const ev of sd(sk)?.events || []) for (const se of ev.sessions || []) if (se.start && ['clasif','carrera'].includes(sType(se.name, se.main))) out.push({ k: sk, ev, se });
  for (const k of keys) for (const ev of [...(sd(k)?.events || []), ...(sd(k)?.next?.events || [])]) for (const se of ev.sessions || []) if (se.start) out.push({ k, ev, se });
  return out.sort((a,b) => tms(a.se) - tms(b.se));
}

/* ---------- ICS (añadir al calendario del móvil) ---------- */
const icsDate = (ms) => new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsEsc = (s) => String(s||'').replace(/[\\;,]/g, m => '\\'+m).replace(/\n/g,'\\n');
function icsEvent(k, ev, se){
  return ['BEGIN:VEVENT', `UID:${(se.id||ev.id+'-'+se.name).replace(/\s/g,'')}@pitwall`, `DTSTAMP:${icsDate(Date.now())}`,
    `DTSTART:${icsDate(tms(se))}`, `DTEND:${icsDate(Math.min(endms(se), tms(se)+6*3600e3))}`,
    `SUMMARY:${icsEsc(`${S[k].short} · ${se.name} — ${ev.name}`)}`, `LOCATION:${icsEsc(ev.circuit || ev.location)}`,
    'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(S[k].short+' '+se.name)}`,'END:VALARM','END:VEVENT'].join('\r\n');
}
function downloadIcs(name, items){
  const body = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PitWall//ES','CALSCALE:GREGORIAN', ...items.map(x => icsEvent(x.k, x.ev, x.se)), 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([body], { type:'text/calendar' }));
  const a = document.createElement('a'); a.href = url; a.download = name.replace(/[^\w\-]+/g,'_') + '.ics';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast('Abre el archivo para añadirlo a tu calendario');
}
let ICS_INDEX = [];
const icsBtn = (k, ev, se) => { const i = ICS_INDEX.push({k,ev,se}) - 1; return `<button class="add" data-ics="${i}" aria-label="Añadir al calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg></button>`; };

const RECENT = 7 * 864e5;
function chgBadge(se){
  if (!se.changedAt || Date.now() - +new Date(se.changedAt) > RECENT || tms(se) < Date.now()) return '';
  const was = se.prevStart ? ` (antes ${fT.format(new Date(se.prevStart))}${dayKey(se.prevStart)!==dayKey(se.start)?' '+fW.format(new Date(se.prevStart)):''})` : '';
  return `<span class="chg">${se.prevStart ? 'Cambio de hora' : 'Hora confirmada'}</span>${was ? `<div class="t2" style="color:#ffd27a">${esc(was.trim())}</div>` : ''}`;
}
const normName = (n) => String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
const initials = (n) => { const p = String(n||'').replace(/\b(jr|sr|ii|iii)\.?$/i,'').trim().split(/\s+/); return ((p[0]||'')[0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase(); };
function face(name, size = 36, ring = ''){
  return '';   // sin fotos ni iniciales de pilotos
}
const MEDAL = ['', 'var(--gold)', 'var(--silver)', 'var(--bronze)'];
function tvFor(k, ev, se){
  const c = st.tv?.series?.[S[k]?.parent || k]; if (!c) return null;
  let canales = c.base || [], gratis = [];
  const year = new Date(ev.start || se.start).getFullYear();
  const hay = `${ev.name} ${ev.circuit || ''} ${ev.location || ''}`;
  for (const r of c.reglas || []){
    try{
      if (r.temporada && r.temporada !== year) continue;
      if (r.pais && ev.country !== r.pais && !(ev.location || '').includes(r.pais)) continue;
      if (r.evento && !new RegExp(r.evento, 'i').test(hay)) continue;
      if (r.sesion && !new RegExp(r.sesion, 'i').test(se.name)) continue;
    }catch{ continue; }
    if (r.canales) canales = r.canales;
    if (r.gratis) gratis = [...gratis, ...r.gratis];
  }
  return { canales, gratis };
}
function tvLine(k, ev, se){
  const t = tvFor(k, ev, se); if (!t || (!t.canales.length && !t.gratis.length)) return '';
  return `<div class="tv">📺 ${t.gratis.length ? `<span class="free">GRATIS</span><span class="fr">${esc(t.gratis.join(' · '))}</span> · ` : ''}${esc(t.canales.join(' · '))}</div>`;
}
/* ---------- Tiempo (Open-Meteo) ---------- */
const wxKey = (ev) => ev && ev.lat != null ? `${(+ev.lat).toFixed(2)},${(+ev.lon).toFixed(2)}` : null;
let wxBusy = false;
async function loadWeather(){
  if (window.DEMO_DATA || wxBusy || !st.data) return;
  wxBusy = true;
  const now = Date.now(), locs = new Map();
  for (const k of Object.keys(st.data.series || {})) for (const ev of [...(sd(k)?.events || []), ...(sd(k)?.next?.events || [])]){
    const key = wxKey(ev); if (!key || locs.has(key)) continue;
    if ((ev.sessions || []).some(se => endms(se) > now - 6*3600e3 && tms(se) < now + 15*864e5)) locs.set(key, ev);
  }
  let changed = false;
  for (const [key, ev] of locs){
    const c = st.wx[key]; if (c && now - c.t < 45*60e3) continue;
    try{
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ev.lat}&longitude=${ev.lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=UTC&forecast_days=16`);
      const j = await r.json();
      if (j?.hourly?.time){ st.wx[key] = { t: now, h: j.hourly }; changed = true; }
    }catch{}
  }
  for (const k of Object.keys(st.wx)) if (now - st.wx[k].t > 2*864e5) { delete st.wx[k]; changed = true; }
  wxBusy = false;
  if (changed){ LS.set('wx', st.wx); render(); }
}
function wxAt(ev, ms){
  const c = st.wx[wxKey(ev)]; if (!c) return null;
  const d = new Date(ms); d.setUTCMinutes(0, 0, 0);
  const i = c.h.time.indexOf(d.toISOString().slice(0, 13) + ':00'); if (i < 0) return null;
  return { temp: c.h.temperature_2m[i], pp: c.h.precipitation_probability?.[i], code: c.h.weather_code[i], wind: c.h.wind_speed_10m?.[i] };
}
const WXI = (c) => c === 0 ? ['☀️','Despejado'] : c <= 2 ? ['🌤️','Poco nuboso'] : c === 3 ? ['☁️','Nublado'] : c <= 48 ? ['🌫️','Niebla'] : c <= 57 ? ['🌦️','Llovizna'] : c <= 67 ? ['🌧️','Lluvia'] : c <= 77 ? ['🌨️','Nieve'] : c <= 82 ? ['🌧️','Chubascos'] : c <= 86 ? ['🌨️','Nieve'] : ['⛈️','Tormenta'];
function wxLine(ev, se, big){
  if (endms(se) < Date.now()) return '';
  const w = wxAt(ev, tms(se)); if (!w || w.temp == null) return '';
  const [ic, tx] = WXI(w.code);
  return `<div class="wx ${w.pp >= 50 ? 'rain' : ''}">${ic} ${Math.round(w.temp)}°<span class="wxt"> · ${tx}</span>${w.pp != null ? ` · 💧 ${w.pp}%` : ''}${big && w.wind != null ? ` · 💨 ${Math.round(w.wind)} km/h` : ''}</div>`;
}

const baseTopic = () => st.meta?.topic || ('und-' + (location.hostname.split('.')[0] + '-' + (location.pathname.split('/')[1] || '')).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 56));
if (!st.al.dev){ st.al.dev = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); LS.set('alerts', st.al); }
const topic = () => (baseTopic().slice(0, 50) + '-' + st.al.dev);   // tema propio de este móvil

let alT;
function saveAlerts(){
  st.al.t = Date.now(); st.al.tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Madrid';
  st.al.url = location.origin + location.pathname;
  LS.set('alerts', st.al);
  clearTimeout(alT); alT = setTimeout(publishAlerts, 1200);
}
async function publishAlerts(silent){
  if (window.DEMO_DATA) { if (!silent) toast('En la vista previa no se guardan los avisos'); return; }

    const r = await fetch(`https://ntfy.sh/${baseTopic()}-cfg`, { method:'POST', body: JSON.stringify({ ...st.al, topic: topic() }) });
    if (!r.ok) throw 0;
    st.al.pub = Date.now(); LS.set('alerts', st.al);
    if (!silent) toast('Avisos guardados ✓ · se aplican en unos 5 min');

/* ---------- MotoGP · Moto2 · Moto3 ---------- */
const ck = () => st.sel === 'motogp' ? (st.cls || 'motogp') : st.sel;
const clsSeg = () => st.sel !== 'motogp' ? '' : `<div class="seg cls">${CLASSES.map(c => `<button class="${ck()===c?'on':''}" data-cls="${c}" style="--c:${S[c].color}">${S[c].short}</button>`).join('')}</div>`;

/* ---------- Fin de semana de carrera ---------- */
function findEv(k, id){ const s = sd(k); return [...(s?.events || []), ...(s?.next?.events || [])].find(e => e.id === id); }
function weekendEvents(){
  const now = Date.now(), out = [];
  for (const k of (st.favs.length ? st.favs : SERIES.map(s => s.key))) for (const ev of [...(sd(k)?.events || []), ...(sd(k)?.next?.events || [])]){
    if (!ev.sessions?.length) continue;
    const s0 = tms(ev.sessions[0]), e1 = Math.max(...ev.sessions.map(endms));
    if (s0 < now + 4*864e5 && e1 > now - 12*3600e3) out.push({ k, ev });
  }
  return out.sort((a, b) => tms(a.ev.sessions[0]) - tms(b.ev.sessions[0]));
}
function findeItems(k, ev){
  let items = ev.sessions.map(se => ({ k, ev, se }));
  if (k === 'motogp') for (const sk of ['moto2','moto3']){
    const e2 = (sd(sk)?.events || []).find(x => x.uid && x.uid === ev.uid);
    if (e2) items.push(...e2.sessions.map(se => ({ k: sk, ev: e2, se })));
  }
  return items.sort((a, b) => tms(a.se) - tms(b.se));
}

function vAgenda(){
  const keys = st.favs.length ? st.favs : SERIES.map(s=>s.key);
  const all = sessions(keys), now = Date.now();
  const live = all.filter(x => isLive(x.se, now));
  const nextMain = all.find(x => x.se.main && !S[x.k].parent && tms(x.se) > now) || all.find(x => tms(x.se) > now);
  let h = '';
  const wk = weekendEvents();
  if (wk.length){
    h += `<h2>🏁 Fin de semana de carrera</h2><div class="hscroll">` + wk.map(({ k, ev }) => {
      const items = findeItems(k, ev), nx = items.find(x => endms(x.se) > now), lv = items.find(x => isLive(x.se, now));
      const d0 = new Date(tms(ev.sessions[0])), d1 = new Date(Math.max(...ev.sessions.map(tms)));
      const what = lv ? `<span class="live">Directo</span> ${esc(lv.se.name)}` : nx ? `Próxima: ${S[nx.k].parent ? S[nx.k].short + ' · ' : ''}${esc(nx.se.name)} · ${fW.format(tms(nx.se))} ${nx.se.tbc ? 'TBC' : fT.format(tms(nx.se))}` : 'Finalizado';
      return `<button class="wk" style="--c:${S[k].color}" data-finde="${k}|${esc(ev.id)}"><span class="badge" style="--c:${S[k].color}">${S[k].short}</span>
        <b>${flag(ev)} ${esc(ev.name)}</b><div class="t2" style="color:#ffffffb0">${fDs.format(d0)}${dayKey(d0) !== dayKey(d1) ? ' – ' + fDs.format(d1) : ''} · ${esc(ev.circuit || ev.location || '')}</div>
        <div class="t2" style="color:#fff;margin-top:8px;white-space:normal;padding-right:70px">${what}</div><span class="go">Abrir ›</span></button>`;
    }).join('') + `</div>`;
  }

  if (nextMain){
    const { k, ev, se } = nextMain;
    h += `<div class="hero" style="--c:${S[k].color}" data-finde="${k}|${esc(ev.id)}">
      <span class="tag">${S[k].short} · Próxima ${esc(se.name.toLowerCase())}</span>
      <h3>${flag(ev)} ${esc(ev.name)}</h3>
      <div class="loc">${esc(ev.circuit || ev.location)}${ev.round?` · Ronda ${ev.round}`:''}</div>
      ${wxLine(ev, se, true)}${tvLine(k, ev, se)}
      <div class="cd" data-cd="${tms(se)}"><div><b>--</b><span>días</span></div><div><b>--</b><span>horas</span></div><div><b>--</b><span>min</span></div><div><b>--</b><span>seg</span></div></div>
      <div class="when"><span>${esc(dayLabel(tms(se)))}</span><strong>${se.tbc?'Hora por confirmar':fT.format(tms(se))}</strong></div>
    </div>`;
  }

  if (live.length){
    h += `<h2>En directo</h2><div class="card">` + live.map(x => row(x, true)).join('') + `</div>`;
  }

  const fresh = keys.filter(k => sd(k)?.next?.events?.length && now - +new Date(sd(k).next.publishedAt || 0) < 21*864e5);
  if (fresh.length){
    const y = sd(fresh[0]).next.season;
    h += `<button class="newcal" data-go-cal="${fresh[0]}" data-season="${y}"><span style="font-size:26px">🗓️</span><div class="grow"><b>Calendario ${y} publicado</b><div class="t2" style="white-space:normal">${fresh.map(k => S[k].short).join(' · ')} — toca para verlo</div></div>${IC.chev.replace('class="chev"','class="chev" style="transform:rotate(-90deg)"')}</button>`;
  }
  const up = all.filter(x => tms(x.se) > now && tms(x.se) < now + 10*864e5).slice(0, 60);
  h += `<h2>Próximas sesiones <span class="sub">Hora de tu móvil</span></h2>`;
  if (!up.length) h += `<div class="card"><div class="empty"><b>Sin sesiones</b>No hay sesiones en los próximos 10 días para tus series.</div></div>`;
  let cur = null, buf = '';
  for (const x of up){
    const dk = dayKey(tms(x.se));
    if (dk !== cur){ if (buf) h += buf + '</div>'; cur = dk; buf = `<div class="day">${esc(dayLabel(tms(x.se)))}</div><div class="card">`; }
    buf += row(x);
  }
  if (buf) h += buf + '</div>';

  const wins = keys.map(k => {
    const ev = [...(sd(k)?.events||[])].reverse().find(e => e.done && e.winner);
    if (!ev) return null;
    const ses = [...ev.sessions].reverse().find(s => s.main && s.result?.length) || [...ev.sessions].reverse().find(s => s.result?.length);
    return { k, ev, r: ses?.result?.[0] };
  }).filter(x => x && x.r).sort((a,b) => +new Date(b.ev.end) - +new Date(a.ev.end));
  if (wins.length){
    h += `<h2>Últimos ganadores</h2><div class="hscroll">` + wins.map(({k,ev,r}) => `
      <button class="win" style="--c:${S[k].color}" data-goto-res="${k}|${esc(ev.id)}">
        <span class="badge" style="--c:${S[k].color}">${S[k].short}</span>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px">${face(r.name, 50, 'var(--gold)')}<div style="min-width:0"><div class="who" style="margin:0">🏆 ${esc(r.name)}</div><div class="tm">${esc(r.team||'')}</div></div></div>
        <div class="t2">${flag(ev)} ${esc(ev.name)} · ${fDs.format(new Date(ev.start))}</div>
      </button>`).join('') + `</div>`;
  }
  const nw = (st.news?.items || []).filter(n => keys.includes(n.key) && (st.newsEn || n.lang === 'es')).sort((a,b) => b.score - a.score).slice(0, 3);
  if (nw.length){
    h += `<h2>Noticias<span class="sub"><button data-view="noticias" style="color:var(--txt);font-weight:600">Ver todas ›</button></span></h2><div class="card">` +
      nw.map(n => `<a class="nitem" href="${esc(n.link)}" target="_blank" rel="noopener"><div class="grow"><div class="ntitle">${esc(n.title)}</div><div class="nmeta" style="color:var(--mut);margin-top:6px"><span class="badge" style="--c:${S[n.key].color}">${S[n.key].short}</span><span>${esc(n.source)} · ${esc(ago(n.date))}</span></div></div><div class="nthumb" style="--c:${S[n.key].color}">${n.img?`<img src="${esc(n.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:S[n.key].short}</div></a>`).join('') + `</div>`;
  }
  return h;
}

function row({k, ev, se}, liveRow){
  const t = tms(se);
  return `<div class="row">
    <div class="time">${se.tbc ? '<small>hora</small>TBC' : fT.format(t)}${liveRow ? '' : `<small>${fW.format(t)}</small>`}</div>
    <div class="grow"><div class="t1">${liveRow?'<span class="live">Directo</span> ':''}${esc(se.name)}${chgBadge(se)}</div><div class="t2"><span class="sbadge mob" style="--c:${S[k].color}">${S[k].short}</span>${flag(ev)} ${esc(ev.name)}</div>${tms(se) > Date.now() - 6*3600e3 ? wxLine(ev, se) + tvLine(k, ev, se) : ''}</div>
    <span class="badge rb" style="--c:${S[k].color}">${S[k].short}${wantsAlert(k, se) && tms(se) > Date.now() ? ' 🔔' : ''}</span>${liveRow?'':icsBtn(k,ev,se)}
  </div>`;
}

function vCal(){
  const k = ck(), base = sd(k), c = S[k].color;
  if (!base?.events?.length && !base?.next?.events?.length) return emptySeries(k);
  const seasons = [base.events?.length ? base.season : null, base.next?.events?.length ? base.next.season : null].filter(Boolean);
  const curDone = base.events?.length && base.events.every(e => e.done);
  const want = st.calSeason[k] || (curDone && base.next ? base.next.season : seasons[0]);
  const s = want === base.next?.season ? { ...base.next } : base;
  const toggle = seasons.length > 1 ? `<div class="seg">${seasons.map(y => `<button class="${y===want?'on':''}" data-cal-season="${y}">Temporada ${y}${y===base.next?.season?' · nuevo':''}</button>`).join('')}</div>` : '';
  const now = Date.now();
  const nextIdx = s.events.findIndex(e => !e.done);
  const all = s.events.flatMap(ev => ev.sessions.filter(se => tms(se) > now).map(se => ({k,ev,se})));
  let h = `<h2>${esc(S[k].name)} ${s.season||''}<span class="sub">${s.events.filter(e=>e.done).length}/${s.events.length} completadas</span></h2>` + toggle;
  if (all.length){ const i = ICS_INDEX.push({ all, name:`${S[k].short}_${s.season}` }) - 1; h += `<div style="margin:-2px 0 12px"><button class="btn" data-ics-all="${i}">${IC.calendario} Añadir temporada al calendario</button></div>`; }
  const tvk = S[k].parent || k;
  if (st.tv?.series?.[tvk]?.nota) h += `<div class="note" style="margin-top:0">📺 ${esc(st.tv.series[tvk].nota)}</div>`;
  h += s.events.map((ev, i) => {
    const open = st.open === ev.id, live = ev.sessions.some(se => isLive(se, now));
    const status = live ? '<span class="live">Directo</span>' : ev.done ? '<span class="st done">Final</span>' : i === nextIdx ? '<span class="st next">Próxima</span>' : '';
    const range = ev.end && dayKey(ev.start) !== dayKey(ev.end) ? `${fDs.format(new Date(ev.start))} – ${fDs.format(new Date(ev.end))}` : fDs.format(new Date(ev.start));
    return `<div class="card ${open?'open':''}" style="--c:${c}">
      <button class="ev ${ev.done && !open ? 'past':''}" data-open="${esc(ev.id)}">
        <div class="rnd"><b>${ev.round ?? i+1}</b><span>Ronda</span></div>
        <div class="grow"><div class="t1"><span class="flag">${flag(ev)}</span>${esc(ev.name)}</div>
          <div class="t2">${range} · ${esc(ev.circuit || ev.location || '')}</div>
          ${ev.done && ev.winner ? `<div class="t2" style="color:#d6dde8">🏆 ${esc(ev.winner)}</div>`:''}</div>
        ${status}${IC.chev}
      </button>
      ${open ? `<div class="sess">${ev.sessions.map(se => `<div class="row">
          <div class="time">${se.tbc?'TBC':fT.format(tms(se))}<small>${fW.format(tms(se))} ${new Date(tms(se)).getDate()}</small></div>
          <div class="grow"><div class="t1">${isLive(se)?'<span class="live">Directo</span> ':''}${esc(se.name)}${chgBadge(se)}${wantsAlert(k, se) && tms(se) > now ? '<span class="bell">🔔</span>' : ''}</div>${se.result?.[0]?`<div class="t2">🏆 ${esc(se.result[0].name)}</div>`:(endms(se) > now ? wxLine(ev, se) + tvLine(k, ev, se) : '')}</div>
          ${se.result?.length ? `<button class="btn" style="height:34px" data-goto-res="${k}|${esc(ev.id)}|${esc(se.name)}">Ver</button>` : tms(se) > now ? icsBtn(k,ev,se) : ''}
        </div>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  return h;

function vRes(){
  const k = ck(), s = sd(k);

  return h;

function vStand(){
  const k = ck(), s = sd(k), c = S[k].color;
  const stn = s?.standings || {};
  const hasTeams = stn.teams?.length;
  const tab = hasTeams ? st.stTab : 'drivers';
  const list = (tab === 'teams' ? stn.teams : stn.drivers) || [];
  let h = `<h2>Mundial ${s?.season||''}<span class="sub">${esc(S[k].name)}</span></h2>`;
  if (hasTeams) h += `<div class="seg"><button class="${tab==='drivers'?'on':''}" data-st="drivers">${k==='motogp'||k==='wsbk'?'Pilotos':'Pilotos'}</button><button class="${tab==='teams'?'on':''}" data-st="teams">${esc(stn.teamsLabel||'Equipos')}</button></div>`;
  if (!list.length) return h + `<div class="card"><div class="empty"><b>Sin clasificación</b>${esc(stn.note || 'Todavía no hay puntos en esta temporada.')}</div></div>`;
  const L = list[0], max = L.pts || 1;
  h += `<div class="leader" style="--c:${c}"><div class="big">1</div>${tab==='drivers' ? face(L.name, 68, 'var(--gold)') : ''}<div class="grow"><div class="t2" style="color:#fff9">Líder del campeonato</div><div class="nm">${esc(L.name)}</div>${L.team?`<div class="t2">${esc(L.team)}</div>`:''}</div>
        <div class="val"><b style="font-size:34px">${L.pts}</b><small>puntos</small></div></div>`;
  h += `<div class="card tbl" style="--c:${c}">${list.map((x,i) => `<div class="row"><div class="pos ${['','g','s','b'][x.pos]||''}">${x.pos}</div>${tab==='drivers' ? face(x.name, 40, MEDAL[x.pos]||'') : ''}
      <div class="grow"><div class="t1">${esc(x.name)}</div><div class="t2">${esc(x.team||'')}${x.wins?` · ${x.wins} ${x.wins===1?'victoria':'victorias'}`:''}</div>
      <div class="bar"><i style="width:${Math.max(2, (x.pts||0)/max*100)}%"></i></div></div>
      <div class="val"><b>${x.pts ?? 0}</b><small>${i ? '−'+(L.pts - (x.pts||0)) : 'pts'}</small></div></div>`).join('')}</div>`;
  const notes = [stn.note, tab==='teams' ? stn.teamsNote : ''].filter(Boolean);
  if (notes.length) h += `<div class="note">ⓘ ${esc(notes.join(' '))}</div>`;
  return h;
}

function vNews(){
  const keys = st.favs.length ? st.favs : SERIES.map(s=>s.key);
  const all = (st.news?.items || []).filter(n => keys.includes(n.key) && (st.newsEn || n.lang === 'es'));
  let h = `<h2>Noticias<span class="sub">${st.news?.updated ? 'Actualizado ' + ago(st.news.updated) : ''}</span></h2>`;
  if (!all.length) return h + `<div class="card"><div class="empty"><b>Sin noticias</b>${st.news ? 'No hay noticias recientes para las series seleccionadas.' : 'Las noticias aparecerán tras la próxima actualización.'}</div></div>`;
  const thumb = (n, cls) => n.img ? `<img src="${esc(n.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const meta = (n) => `<span class="badge" style="--c:${S[n.key].color}">${S[n.key].short}</span><span>${esc(n.source)}</span><span class="lang">${n.lang.toUpperCase()}</span><span>· ${esc(ago(n.date))}</span>`;
  // destacadas: las de mayor puntuación, máximo 2 por serie
  const per = {}, feat = [];
  for (const n of [...all].sort((a,b) => b.score - a.score)) { if ((per[n.key] = (per[n.key]||0) + 1) <= 2) feat.push(n); if (feat.length >= 6) break; }
  h += `<div class="hscroll">` + feat.map(n => `<a class="nfeat" style="--c:${S[n.key].color}" href="${esc(n.link)}" target="_blank" rel="noopener">${thumb(n)}
      <div class="in">${n.also?.length ? '<span class="hot">🔥 Destacada</span>' : ''}<h4>${esc(n.title)}</h4><div class="nmeta">${meta(n)}</div></div></a>`).join('') + `</div>`;
  const featSet = new Set(feat.map(n => n.link));
  const rest = all.filter(n => !featSet.has(n.link)).sort((a,b) => +new Date(b.date) - +new Date(a.date)).slice(0, 80);
  h += `<h2>Últimas</h2><div class="card">` + rest.map(n => `<a class="nitem" href="${esc(n.link)}" target="_blank" rel="noopener">
      <div class="grow"><div class="ntitle">${esc(n.title)}</div>${n.summary?`<div class="nsum">${esc(n.summary)}</div>`:''}
        <div class="nmeta" style="color:var(--mut);margin-top:6px">${meta(n)}${n.also?.length?`<span>· también en ${esc(n.also.slice(0,2).join(', '))}</span>`:''}</div></div>
      <div class="nthumb" style="--c:${S[n.key].color}">${n.img ? thumb(n) : S[n.key].short}</div></a>`).join('') + `</div>`;
  h += `<div class="note">ⓘ Titulares de ${[...new Set(all.map(n=>n.source))].slice(0,6).join(', ')}. Toca una noticia para leerla completa en su medio.</div>`;
  return h;
}

function vFinde(){

  let cur = null, buf = '';

    const live = isLive(se, now), past = endms(se) < now;
    const status = live ? '<span class="live">Directo</span>' : past ? (se.result?.length ? '<span class="st done">Final</span>' : '<span class="st up">Terminada</span>') : (nx && nx.se === se ? '<span class="st next" style="--c:' + S[k].color + '">Próxima</span>' : '');
    const res = se.result?.length ? `<div class="mini">${se.result.slice(0, 3).map(r => `<div><span class="p" style="color:${MEDAL[r.pos]}">${r.pos}</span>${face(r.name, 28, MEDAL[r.pos])}<span class="grow t1" style="font-size:13px">${esc(r.name)}</span><span class="t2">${esc(r.time || '')}</span></div>`).join('')}

    buf += `<div class="fs ${past && !live ? 'past' : ''} ${live ? 'live' : ''}">

      <div class="grow"><div class="t1" style="white-space:normal">${S[x.k].parent ? `<span class="sbadge" style="--c:${S[x.k].color}">${S[x.k].short}</span>` : (k === 'motogp' ? `<span class="sbadge" style="--c:${S.motogp.color}">MotoGP</span>` : '')}${esc(se.name)}${wantsAlert(x.k, se) && !past ? '<span class="bell">🔔</span>' : ''} ${status}</div>

/* ---------- Countdown ---------- */
function tick(){
  document.querySelectorAll('[data-cd]').forEach(el => {
    let d = Math.max(0, +el.dataset.cd - Date.now()) / 1000;
    const v = [Math.floor(d/86400), Math.floor(d%86400/3600), Math.floor(d%3600/60), Math.floor(d%60)];
    el.querySelectorAll('b').forEach((b,i) => b.textContent = String(v[i]).padStart(2,'0'));
  });
}

let toastT;
function toast(msg){
  let t = $('toast'); if (!t){ t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:calc(var(--sab) + 104px);transform:translateX(-50%);z-index:50;background:#fff;color:#000;font-weight:600;font-size:13px;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #0008;transition:opacity .3s;max-width:90vw;text-align:center'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2600);
}

async function load(){
  if (window.DEMO_DATA){ st.data = window.DEMO_DATA; st.news = window.DEMO_NEWS || null; render(); return; }
  if (st.loading) return;
  fetch('data/meta.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).then(m => { if (m?.topic && m.topic !== st.meta?.topic){ st.meta = m; LS.set('meta', m); } }).catch(() => {});
  if (st.al.on && Date.now() - (st.al.pub || 0) > 10*3600e3) publishAlerts(true);
  fetch('data/status.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).then(x => { if (x?.checked){ st.status = x; renderHeader(); } }).catch(() => {});
  fetch('data/tv.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).then(t => { if (t?.series){ const ch = JSON.stringify(t) !== JSON.stringify(st.tv); st.tv = t; LS.set('tv', t); if (ch) render(); } }).catch(() => {});
  fetch('data/news.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).then(n => { if (n?.items && n.updated !== st.news?.updated){ st.news = n; LS.set('news', n); if (st.view === 'noticias' || st.view === 'agenda') render(); } }).catch(() => {});
  st.loading = true; renderHeader();
  try{
    const r = await fetch('data/data.json', { cache:'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.updated && !Object.keys(d.series||{}).length) throw new Error('vacío');
    const changed = d.updated !== st.data?.updated;
    st.data = d; st.offline = false;
    if (changed){ LS.set('cache', d); st.loading = false; render(); loadWeather(); return; }
  }catch{
    st.offline = !navigator.onLine;
    if (!st.data){ st.data = LS.get('cache', null); st.loading = false; render(); return; }
  }
  st.loading = false; renderHeader(); loadWeather();
}
st.data = window.DEMO_DATA || LS.get('cache', null);
if (window.DEMO_NEWS) st.news = window.DEMO_NEWS;
if (window.DEMO_TV) st.tv = window.DEMO_TV;
/* ---------- Cuenta de propietario (Supabase Auth) ---------- */
const CFG = window.UND_CONFIG || {};
const APP_URL = location.origin + location.pathname;
let sb = null, session = null;
const maskMail = (m) => String(m || '').replace(/^(.)(.*)(@.*)$/, (_, a, b, c) => a + '•'.repeat(Math.min(6, b.length)) + c);
const isOwner = (s) => !!s?.user?.email && s.user.email.toLowerCase() === String(CFG.ownerEmail || '').toLowerCase();
const authReady = () => !!(CFG.supabaseUrl && CFG.supabaseKey);
const WM = `<svg viewBox="-27 -3 104 44" aria-label="UND"><g transform="skewX(-14)">
  <g fill="#ff2a2a"><rect x="-22" y="4" width="16" height="4" rx="1"/><rect x="-17" y="13" width="11" height="4" rx="1"/><rect x="-12" y="22" width="6" height="4" rx="1"/></g>
  <g fill="#fff"><path fill-rule="evenodd" d="M0 0H7V21L9 23H13L15 21V0H22V24L16 30H6L0 24Z M26 30V0H33L41 16V0H48V30H41L33 14V30Z M52 0H68L74 6V24L68 30H52Z M59 7H65L67 9V21L65 23H59Z"/></g>
  <rect x="0" y="34" width="56" height="3.2" fill="#ff2a2a"/>
  <g fill="#fff"><rect x="58" y="34" width="3.2" height="1.6"/><rect x="61.2" y="35.6" width="3.2" height="1.6"/><rect x="64.4" y="34" width="3.2" height="1.6"/><rect x="67.6" y="35.6" width="3.2" height="1.6"/><rect x="70.8" y="34" width="3.2" height="1.6"/></g>
  <g fill="#ffffff55"><rect x="61.2" y="34" width="3.2" height="1.6"/><rect x="58" y="35.6" width="3.2" height="1.6"/><rect x="67.6" y="34" width="3.2" height="1.6"/><rect x="64.4" y="35.6" width="3.2" height="1.6"/><rect x="70.8" y="35.6" width="3.2" height="1.6"/></g>
  </g></svg>`;
function showAuth(mode, msg = ''){
  const A = $('auth'); A.classList.remove('off');
  const head = `<span class="wm">${WM}</span><span class="sl">Undercut de manual</span>`;
  const forms = {
    login: `<h3>Acceso propietario</h3><p>Solo para el propietario de la app. Para usar UND no hace falta cuenta.</p>
      <form data-auth="login"><label>Usuario</label><input name="u" autocomplete="username" autocapitalize="none" required>
      <label>Contraseña</label><input name="p" type="password" autocomplete="current-password" required>
      <div class="err">${esc(msg)}</div><button class="pri" type="submit">Entrar</button></form>
      <button class="lnk" data-auth-go="olvido">¿Olvidaste la contraseña?</button>
      <button class="lnk" style="color:var(--mut);font-weight:500" data-auth-go="registro">Primera vez: registrar propietario</button>`,
    registro: `<h3>Registrar propietario</h3><p>Crea la cuenta de propietario. Después te llegará un correo a <b>${esc(maskMail(CFG.ownerEmail))}</b> para confirmarla.</p>
      <form data-auth="registro"><label>Usuario</label><input name="u" autocomplete="username" autocapitalize="none" required>
      <label>Contraseña</label><input name="p" type="password" autocomplete="new-password" minlength="8" required>
      <label>Repite la contraseña</label><input name="p2" type="password" autocomplete="new-password" minlength="8" required>
      <div class="err">${esc(msg)}</div><button class="pri" type="submit">Crear cuenta</button></form>
      <button class="lnk" data-auth-go="login">‹ Ya tengo cuenta</button>`,
    olvido: `<h3>Recuperar contraseña</h3><p>Te enviaremos un enlace a <b>${esc(maskMail(CFG.ownerEmail))}</b>. Ábrelo desde este móvil para elegir una contraseña nueva.</p>
      <form data-auth="olvido"><div class="err">${esc(msg)}</div><button class="pri" type="submit">Enviar enlace</button></form>
      <button class="lnk" data-auth-go="login">‹ Volver</button>`,
    nueva: `<h3>Nueva contraseña</h3><p>Escribe la contraseña nueva para la cuenta <b>${esc(CFG.ownerUser || '')}</b>.</p>
      <form data-auth="nueva"><label>Contraseña nueva</label><input name="p" type="password" autocomplete="new-password" minlength="8" required>
      <label>Repítela</label><input name="p2" type="password" autocomplete="new-password" minlength="8" required>
      <div class="err">${esc(msg)}</div><button class="pri" type="submit">Guardar contraseña</button></form>
      `,
    aviso: `<h3>Revisa tu correo</h3><p class="ok">${esc(msg)}</p><button class="lnk" data-auth-go="login">‹ Ir a iniciar sesión</button>`,
    sinconf: `<h3>Falta un paso</h3><p>La cuenta de propietario no está configurada todavía (archivo <b>config.js</b>).</p>`,
  };
  A.innerHTML = `<button class="back" data-auth-go="cerrar" style="position:absolute;top:calc(var(--sat) + 14px);right:16px">✕ Cerrar</button><div class="box">${head}${forms[mode] || forms.login}</div>`;
  A.querySelector('input')?.focus();
}
function hideAuth(){ $('auth').classList.add('off'); $('auth').innerHTML = ''; }
async function initAuth(){
  if (window.DEMO_DATA || !authReady()) return;                 // sin configurar: la app funciona sin cuenta
  for (let i = 0; i < 40 && !window.supabase; i++) await new Promise(r => setTimeout(r, 100));
  if (!window.supabase) return;
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  sb.auth.onAuthStateChange((ev, s) => {
    session = s;
    if (ev === 'PASSWORD_RECOVERY') return showAuth('nueva');
    if (s && isOwner(s)){ LS.set('owner', true); if (ev === 'SIGNED_IN' && /access_token/.test(location.hash)){ try{ history.replaceState(null, '', APP_URL); }catch{} toast('Cuenta de propietario confirmada ✓'); } }
    if (ev === 'SIGNED_OUT') LS.set('owner', false);
    renderHeader();
  });
  const { data } = await sb.auth.getSession(); session = data.session;
  if (session && !isOwner(session)) await sb.auth.signOut();
  renderHeader();
}
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-auth]'); if (!f) return;
  e.preventDefault();
  const mode = f.dataset.auth, v = Object.fromEntries(new FormData(f)), btn = f.querySelector('button[type=submit]'), err = f.querySelector('.err');
  const fail = (m) => { err.textContent = m; btn.disabled = false; };
  btn.disabled = true; err.textContent = '';
  if (!sb) return fail('Sin conexión con el servidor de cuentas.');
  const userOk = () => String(v.u || '').trim().toLowerCase() === String(CFG.ownerUser || '').toLowerCase();
  try{
    if (mode === 'login'){
      if (!userOk()) return fail('Usuario o contraseña incorrectos.');
      const { error } = await sb.auth.signInWithPassword({ email: CFG.ownerEmail, password: v.p });
      if (error) return fail(/confirm/i.test(error.message) ? 'Confirma primero tu cuenta desde el correo que te enviamos.' : 'Usuario o contraseña incorrectos.');
      hideAuth(); toast('Bienvenido, ' + CFG.ownerUser);
    } else if (mode === 'registro'){
      if (!userOk()) return fail('Ese no es el usuario de propietario.');
      if (v.p !== v.p2) return fail('Las contraseñas no coinciden.');
      const { data, error } = await sb.auth.signUp({ email: CFG.ownerEmail, password: v.p, options: { emailRedirectTo: APP_URL, data: { username: CFG.ownerUser } } });
      if (error) return fail(/already|registered|exists/i.test(error.message) ? 'La cuenta ya existe: inicia sesión.' : 'No se pudo crear: ' + error.message);
      if (data.session && isOwner(data.session)){ hideAuth(); toast('Cuenta creada'); }
      else showAuth('aviso', `Te hemos enviado un correo a ${maskMail(CFG.ownerEmail)}. Pulsa el enlace para confirmar la cuenta y después inicia sesión.`);
    } else if (mode === 'olvido'){
      const { error } = await sb.auth.resetPasswordForEmail(CFG.ownerEmail, { redirectTo: APP_URL });
      if (error) return fail('No se pudo enviar: ' + error.message);
      showAuth('aviso', `Te hemos enviado un enlace a ${maskMail(CFG.ownerEmail)}. Ábrelo desde este móvil para poner una contraseña nueva.`);
    } else if (mode === 'nueva'){
      if (v.p !== v.p2) return fail('Las contraseñas no coinciden.');
      const { error } = await sb.auth.updateUser({ password: v.p });
      if (error) return fail('No se pudo cambiar: ' + error.message);
      try{ history.replaceState(null, '', APP_URL); }catch{}
      hideAuth(); toast('Contraseña cambiada ✓');
    }
  }catch(x){ fail('Error de conexión. Inténtalo de nuevo.'); }
});
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-auth-go]'); if (!g) return;
  const m = g.dataset.authGo;
  if (m === 'cerrar') return hideAuth();
  if (m === 'logout'){ closeSheet(); await sb?.auth.signOut(); toast('Sesión de propietario cerrada'); return; }
  if (m === 'cambiar'){ closeSheet(); return showAuth('nueva'); }
  closeSheet(); showAuth(m);
});
initAuth();

try{ localStorage.removeItem('pw_faces'); }catch{}   // borrar fotos guardadas de versiones anteriores
render(); load();
{ let seen = false; try{ seen = !!sessionStorage.getItem('und_seen'); sessionStorage.setItem('und_seen','1'); }catch{}
  const sp = $('splash');
  if (seen) sp.classList.add('off');
  else {
    sp.querySelectorAll('.lights i').forEach((l, i) => setTimeout(() => l.classList.add('on'), 250 + i * 220));
    setTimeout(() => sp.querySelector('.lights').classList.add('out'), 250 + 5 * 220 + 350);   // ¡luces fuera!
    setTimeout(() => sp.classList.add('off'), 250 + 5 * 220 + 700);
  }
}
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 60*1000); // cada minuto
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ load(); } });
setInterval(() => { if (document.visibilityState === 'visible' && !st.loading) renderHeader(); }, 30000);

if ('serviceWorker' in navigator && !window.DEMO_DATA){
  try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch{}
}
