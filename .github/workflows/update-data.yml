name: Actualizar datos

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar calendarios, resultados y clasificaciones
        env:
          TSDB_KEY: ${{ secrets.TSDB_KEY }}
        run: node scripts/update.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "Sin cambios"
          else
            git config user.name "und-bot"
            git config user.email "und-bot@users.noreply.github.com"
            git add data/
            git commit -m "datos: $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
